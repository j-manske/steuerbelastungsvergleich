<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Kontrollrechnungen &ndash; Steuerbelastungsvergleich</title>
    <style>
      body {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        margin: 32px;
        background: #f4f5f7;
        color: #14171c;
        font-size: 13px;
      }
      h1 {
        font-size: 17px;
      }
      #summe {
        padding: 10px 14px;
        border-radius: 8px;
        font-weight: 700;
        display: inline-block;
        margin-bottom: 18px;
      }
      #summe.ok {
        background: #d1fae5;
        color: #065f46;
      }
      #summe.fehler {
        background: #fee2e2;
        color: #991b1b;
      }
      li {
        margin-bottom: 4px;
        list-style: none;
      }
      ul {
        padding: 0;
      }
      .ok::before {
        content: '\2713  ';
        color: #059669;
        font-weight: 700;
      }
      .fehler::before {
        content: '\2717  ';
        color: #dc2626;
        font-weight: 700;
      }
      .fehler {
        color: #991b1b;
      }
      .meldung {
        color: #b91c1c;
        padding-left: 22px;
      }
    </style>
  </head>
  <body>
    <h1>Kontrollrechnungen des Berechnungskerns</h1>
    <div id="summe">läuft …</div>
    <ul id="liste"></ul>
    <script type="module">
      import { laufeTests } from './tests.js';
      const { ergebnisse, bestanden, gesamt } = laufeTests();
      const summe = document.getElementById('summe');
      summe.textContent = `${bestanden} von ${gesamt} Kontrollfällen bestanden`;
      summe.className = bestanden === gesamt ? 'ok' : 'fehler';
      document.getElementById('liste').innerHTML = ergebnisse
        .map(
          (r) =>
            `<li class="${r.ok ? 'ok' : 'fehler'}">${r.name}</li>` +
            (r.ok ? '' : `<li class="meldung">${r.fehler}</li>`)
        )
        .join('');
      console.log(`TESTERGEBNIS ${bestanden}/${gesamt}`);
      ergebnisse.filter((r) => !r.ok).forEach((r) => console.error(`FEHLER: ${r.name} -> ${r.fehler}`));
    </script>
  </body>
</html>
